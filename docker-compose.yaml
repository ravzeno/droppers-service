services:
  droppers-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-droppers}
      POSTGRES_USER: ${DATABASE_USER:-droppers}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  droppers-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${DROPPERS_PORT:-8765}:8765"
    depends_on:
      droppers-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
