server:
  address: ${DROPPERS_BIND_ADDRESS:127.0.0.1}
  port: 8765
  ssl:
    enabled: ${DROPPERS_TLS_ENABLED:false}
    key-store: ${DROPPERS_TLS_KEY_STORE:}
    key-store-password: ${DROPPERS_TLS_KEY_STORE_PASSWORD:}
    key-alias: ${DROPPERS_TLS_KEY_ALIAS:}
spring:
  application:
    name: droppers
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:1GB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1GB}
  jackson:
    default-property-inclusion: ${JACKSON_DEFAULT_PROPERTY_INCLUSION:non_null}
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:droppers}
    username: ${DATABASE_USER:droppers}
    password: ${DATABASE_PASSWORD:droppers}
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog-master.xml

logging:
  level:
    root: INFO

droppers:
  upload:
    max-file-size-bytes: ${DROPPERS_MAX_UPLOAD_BYTES:1073741824}
    staging-ttl-hours: ${DROPPERS_UPLOAD_STAGING_TTL_HOURS:24}
    cleanup-interval-millis: ${DROPPERS_UPLOAD_CLEANUP_INTERVAL_MILLIS:3600000}
  security:
    allowed-hosts: ${DROPPERS_ALLOWED_HOSTS:localhost,127.0.0.1,::1}
    requests-per-minute: ${DROPPERS_RATE_LIMIT_PER_MINUTE:120}
    require-tls-for-lan: ${DROPPERS_REQUIRE_TLS_FOR_LAN:true}
    device-session-ttl-days: ${DROPPERS_DEVICE_SESSION_TTL_DAYS:30}
    admin-token: ${DROPPERS_ADMIN_TOKEN:}
    trusted-proxies: ${DROPPERS_TRUSTED_PROXIES:}
    device-portal-url: ${DROPPERS_DEVICE_PORTAL_URL:}
